plugins { id 'com.android.application' }
android {
    namespace 'cn.qingyue.pdf'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.qingyue.pdf'
        minSdk 23
        targetSdk 35
        versionCode 24
        versionName '1.14.0'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.main.assets.srcDir '../third-party/licenses'
    sourceSets.main.assets.srcDir '../third-party/ocr/models'
    packagingOptions {
        resources.excludes += ['META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF']
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation files('../third-party/pdfbox-android-2.0.27.0.aar')
    implementation files('../third-party/ocr/tesseract4android-4.9.0.aar')
    implementation files('../third-party/ocr/annotation-1.3.0.jar')
    implementation fileTree(dir: '../third-party', include: ['*.jar'])
}
